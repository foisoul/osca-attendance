<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no"
    >

    <title>OSCA Smart Attendance</title>

    <!-- QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            padding: 14px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 1.25rem;
            margin-bottom: 2px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 14px;
            font-size: 0.84rem;
        }

        /* =========================
           STEP INDICATOR
        ========================= */

        .step-indicator {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
        }

        .step {
            flex: 1;
            text-align: center;
            padding: 8px 4px;
            border-radius: 8px;
            background: #1e293b;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .step.active {
            background: #3b82f6;
            color: white;
        }

        .step.done {
            background: #166534;
            color: #bbf7d0;
        }

        /* =========================
           QR READER
        ========================= */

        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #1e293b;
            min-height: 250px;
        }

        /* =========================
           OCR CAMERA
        ========================= */

        #ocr-area {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #020617;
            min-height: 250px;
            position: relative;
            display: none;
        }

        #ocr-area video {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        /*
            Capture guide.

            This is not pretending to be a computer-vision
            card detector. It defines the area that will be
            cropped and sent to OCR.
        */

        .guide-frame {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 88%;
            height: 55%;

            border: 3px solid #22c55e;
            border-radius: 10px;

            pointer-events: none;

            box-shadow:
                0 0 0 9999px rgba(0, 0, 0, 0.42);

            transition:
                border-color 0.25s,
                box-shadow 0.25s;
        }

        .guide-frame.ready {
            border-color: #eab308;
        }

        .guide-frame.capturing {
            border-color: #3b82f6;
        }

        .guide-frame.error {
            border-color: #ef4444;
        }

        .status-label {
            position: absolute;

            bottom: 12px;
            left: 0;
            right: 0;

            text-align: center;

            color: white;

            font-size: 0.88rem;
            font-weight: 500;

            text-shadow:
                0 1px 4px black;

            pointer-events: none;

            padding: 0 10px;
        }

        /* =========================
           RESULT
        ========================= */

        .result-box {
            margin-top: 12px;
            padding: 13px;

            background: #1e293b;

            border-radius: 11px;

            display: none;

            white-space: pre-wrap;

            font-size: 0.9rem;
            line-height: 1.4;
        }

        .result-box.show {
            display: block;
        }

        .success {
            border-left: 4px solid #22c55e;
        }

        .error {
            border-left: 4px solid #ef4444;
        }

        .info {
            border-left: 4px solid #3b82f6;
        }

        .warning {
            border-left: 4px solid #eab308;
        }

        /* =========================
           BUTTONS
        ========================= */

        .btn {
            display: block;

            width: 100%;

            padding: 13px;

            margin-top: 9px;

            border: none;

            border-radius: 10px;

            font-size: 0.95rem;

            font-weight: 600;

            cursor: pointer;
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-warning {
            background: #d97706;
            color: white;
        }

        .btn-secondary {
            background: #334155;
            color: white;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        /* =========================
           EDIT BOX
        ========================= */

        .edit-box {
            background: #1e293b;

            border-radius: 11px;

            padding: 13px;

            margin-top: 11px;

            display: none;
        }

        .edit-box label {
            font-size: 0.8rem;

            color: #94a3b8;

            display: block;

            margin-bottom: 3px;
        }

        .edit-box input,
        .edit-box textarea {
            width: 100%;

            padding: 10px;

            border-radius: 8px;

            border: 1px solid #475569;

            background: #0f172a;

            color: white;

            font-size: 0.95rem;

            margin-bottom: 9px;
        }

        .edit-box input:focus,
        .edit-box textarea:focus {
            outline: none;

            border-color: #3b82f6;
        }

        /* =========================
           SMALL HELP TEXT
        ========================= */

        .hint {
            margin-top: 8px;

            text-align: center;

            font-size: 0.75rem;

            color: #64748b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>OSCA Smart Attendance</h1>

    <p class="subtitle">
        QR + ID Card Auto-Capture
    </p>

    <!-- =========================
         STEPS
    ========================= -->

    <div class="step-indicator">

        <div class="step active" id="step1">
            1. QR
        </div>

        <div class="step" id="step2">
            2. ID Card
        </div>

        <div class="step" id="step3">
            3. Confirm
        </div>

    </div>

    <!-- =========================
         QR CAMERA
    ========================= -->

    <div id="reader"></div>

    <!-- =========================
         ID CAMERA
    ========================= -->

    <div id="ocr-area">

        <video id="camera" autoplay playsinline muted></video>

        <div
            class="guide-frame"
            id="guide"
        ></div>

        <div
            class="status-label"
            id="statusLabel"
        >
            Place the ID card inside the frame
        </div>

    </div>

    <!-- =========================
         RESULT
    ========================= -->

    <div
        id="result"
        class="result-box"
    ></div>

    <!-- =========================
         CONFIRMATION
    ========================= -->

    <div
        class="edit-box"
        id="edit-box"
    >

        <label>
            OSCA ID
        </label>

        <input
            type="text"
            id="edit-id"
            readonly
        >

        <label>
            Full Name
        </label>

        <input
            type="text"
            id="edit-name"
            placeholder="Detected name"
        >

        <label>
            Detected Text
        </label>

        <textarea
            id="edit-raw"
            rows="5"
            style="
                font-size:0.8rem;
                color:#94a3b8;
            "
        ></textarea>

    </div>

    <button
        class="btn btn-warning"
        id="btn-retake"
        style="display:none;"
        onclick="retake()"
    >
        Retake ID Card
    </button>

    <button
        class="btn btn-success"
        id="btn-save"
        style="display:none;"
        onclick="saveFinal()"
    >
        Save Attendance
    </button>

    <button
        class="btn btn-secondary"
        onclick="restart()"
    >
        Start Over
    </button>

    <p class="hint">
        Make sure the ID is flat, visible, and well lit.
    </p>

</div>


<script>

/* ============================================================
   CONFIGURATION
============================================================ */

const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzlrjeYzjjFQh3b8CFBtYc8mkPEChHley_xO2914EAGdwO0lr5Osa3zjdlfEZsWOhOj/exec";


/*
    How often the camera checks the image.

    700ms is faster than your original 1.8 seconds,
    but OCR itself is NOT run every 700ms.

    Only image-quality checks are performed.
*/
const DETECTION_INTERVAL = 700;


/*
    Number of consecutive good frames required
    before automatic capture.
*/
const REQUIRED_GOOD_FRAMES = 3;


/*
    Maximum OCR image width.

    Sending a huge 1920x1080 image to OCR is unnecessary.
*/
const OCR_MAX_WIDTH = 1400;


/* ============================================================
   GLOBAL STATE
============================================================ */

let html5QrCode = null;

let videoStream = null;

let detectionTimer = null;

let currentStep = 1;

let goodFrameCount = 0;

let analyzing = false;

let saving = false;

let ocrBusy = false;

let collected = {
    oscaId: "",
    fullName: "",
    raw: ""
};


/* ============================================================
   STEP CONTROL
============================================================ */

function setStep(step) {

    currentStep = step;

    document.getElementById("step1").className =
        "step" +
        (step === 1
            ? " active"
            : step > 1
                ? " done"
                : "");

    document.getElementById("step2").className =
        "step" +
        (step === 2
            ? " active"
            : step > 2
                ? " done"
                : "");

    document.getElementById("step3").className =
        "step" +
        (step === 3
            ? " active"
            : "");

    document.getElementById("reader").style.display =
        step === 1 ? "block" : "none";

    document.getElementById("ocr-area").style.display =
        step === 2 ? "block" : "none";

    document.getElementById("edit-box").style.display =
        step === 3 ? "block" : "none";

    document.getElementById("btn-retake").style.display =
        step === 3 ? "block" : "none";

    document.getElementById("btn-save").style.display =
        step === 3 ? "block" : "none";
}


/* ============================================================
   RESET
============================================================ */

function restart() {

    stopQR();

    stopCamera();

    clearDetectionTimer();

    currentStep = 1;

    goodFrameCount = 0;

    analyzing = false;

    saving = false;

    ocrBusy = false;

    collected = {
        oscaId: "",
        fullName: "",
        raw: ""
    };

    document.getElementById("result").className =
        "result-box";

    document.getElementById("result").innerText = "";

    document.getElementById("edit-id").value = "";

    document.getElementById("edit-name").value = "";

    document.getElementById("edit-raw").value = "";

    document.getElementById("guide").className =
        "guide-frame";

    document.getElementById("statusLabel").innerText =
        "Place the ID card inside the frame";

    document.getElementById("btn-save").disabled = false;

    setStep(1);

    startQR();

    show(
        "Step 1: Scan the OSCA QR code.",
        "info"
    );
}


/* ============================================================
   QR SCANNER
============================================================ */

function startQR() {

    if (html5QrCode) {
        return;
    }

    html5QrCode =
        new Html5Qrcode("reader");

    Html5Qrcode
        .getCameras()
        .then(cameras => {

            if (!cameras || cameras.length === 0) {

                show(
                    "No camera was found.",
                    "error"
                );

                return;
            }

            /*
                Prefer the last camera.

                On many phones this is the rear camera.
            */

            const camera =
                cameras[cameras.length - 1];

            return html5QrCode.start(
                camera.id,
                {
                    fps: 10,

                    qrbox: {
                        width: 250,
                        height: 250
                    },

                    aspectRatio: 1.0
                },
                onQR,
                () => {}
            );

        })
        .catch(error => {

            show(
                "Unable to start QR camera.\n\n" +
                error.message,
                "error"
            );

        });
}


function stopQR() {

    if (!html5QrCode) {
        return;
    }

    const scanner = html5QrCode;

    html5QrCode = null;

    scanner
        .stop()
        .then(() => {

            try {
                scanner.clear();
            } catch (_) {}

        })
        .catch(() => {

            try {
                scanner.clear();
            } catch (_) {}

        });
}


/* ============================================================
   QR RESULT
============================================================ */

function onQR(decodedText) {

    if (currentStep !== 1) {
        return;
    }

    stopQR();

    const id =
        extractOSCAId(decodedText);

    if (!id) {

        show(
            "QR detected, but no valid OSCA ID was found.\n\n" +
            "Please scan the correct OSCA QR code.",
            "error"
        );

        startQR();

        return;
    }

    collected.oscaId = id;

    show(
        "QR captured successfully!\n\n" +
        "OSCA ID: " + id +
        "\n\n" +
        "Now place the physical ID card inside the frame.",
        "success"
    );

    setStep(2);

    startCamera();

}


/* ============================================================
   OSCA ID EXTRACTION
============================================================ */

function extractOSCAId(text) {

    if (!text) {
        return "";
    }

    let value =
        String(text).trim();

    /*
        Example:

        Senior_citizen_id=12345
    */

    const keyMatch =
        value.match(
            /Senior[_\s-]*citizen[_\s-]*id\s*=\s*([A-Za-z0-9-]+)/i
        );

    if (keyMatch) {
        return keyMatch[1].trim();
    }

    /*
        UUID
    */

    const uuid =
        value.match(
            /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i
        );

    if (uuid) {
        return uuid[0];
    }

    /*
        If your OSCA QR contains only an ID,
        allow a simple alphanumeric value.
    */

    value =
        value.replace(/\s+/g, "");

    if (
        /^[A-Za-z0-9_-]{3,50}$/.test(value)
    ) {
        return value;
    }

    return "";
}


/* ============================================================
   CAMERA
============================================================ */

async function startCamera() {

    stopCamera();

    try {

        videoStream =
            await navigator.mediaDevices.getUserMedia({

                audio: false,

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    },

                    aspectRatio: {
                        ideal: 16 / 9
                    }
                }

            });

        const video =
            document.getElementById("camera");

        video.srcObject =
            videoStream;

        await video.play();

        document.getElementById("statusLabel").innerText =
            "Looking for a clear ID card...";

        startAutoDetection();

    } catch (error) {

        show(
            "Camera error:\n\n" +
            error.message +
            "\n\n" +
            "Please allow camera permission.",
            "error"
        );

        document.getElementById("statusLabel").innerText =
            "Camera permission required";

    }
}


function stopCamera() {

    clearDetectionTimer();

    if (videoStream) {

        videoStream
            .getTracks()
            .forEach(track => {
                track.stop();
            });

        videoStream = null;
    }

    const video =
        document.getElementById("camera");

    if (video) {
        video.srcObject = null;
    }

    analyzing = false;

    goodFrameCount = 0;
}


function clearDetectionTimer() {

    if (detectionTimer) {

        clearInterval(detectionTimer);

        detectionTimer = null;
    }
}


/* ============================================================
   AUTO DETECTION
============================================================ */

function startAutoDetection() {

    clearDetectionTimer();

    goodFrameCount = 0;

    detectionTimer =
        setInterval(() => {

            if (currentStep !== 2) {
                return;
            }

            if (analyzing || ocrBusy) {
                return;
            }

            checkCameraFrame();

        }, DETECTION_INTERVAL);
}


/* ============================================================
   IMAGE QUALITY CHECK
============================================================ */

function checkCameraFrame() {

    const video =
        document.getElementById("camera");

    if (
        !video ||
        video.readyState < 2 ||
        video.videoWidth === 0
    ) {
        return;
    }

    analyzing = true;

    const canvas =
        document.createElement("canvas");

    /*
        Small image is enough for quality analysis.
    */

    const scale =
        Math.min(
            1,
            640 / video.videoWidth
        );

    canvas.width =
        Math.round(video.videoWidth * scale);

    canvas.height =
        Math.round(video.videoHeight * scale);

    const ctx =
        canvas.getContext("2d", {
            willReadFrequently: true
        });

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    /*
        Analyze only the central region,
        because that is where the ID should be.
    */

    const crop =
        getCenterRegion(
            canvas,
            0.88,
            0.55
        );

    const quality =
        calculateImageQuality(crop);

    if (quality.good) {

        goodFrameCount++;

        document.getElementById("guide").className =
            "guide-frame ready";

        document.getElementById("statusLabel").innerText =
            "Good position — hold steady (" +
            goodFrameCount +
            "/" +
            REQUIRED_GOOD_FRAMES +
            ")";

        if (
            goodFrameCount >=
            REQUIRED_GOOD_FRAMES
        ) {

            clearDetectionTimer();

            captureForOCR(video);
        }

    } else {

        goodFrameCount = 0;

        document.getElementById("guide").className =
            "guide-frame";

        document.getElementById("statusLabel").innerText =
            quality.message;
    }

    analyzing = false;
}


/* ============================================================
   QUALITY CALCULATION
============================================================ */

function calculateImageQuality(canvas) {

    const ctx =
        canvas.getContext("2d", {
            willReadFrequently: true
        });

    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const data =
        image.data;

    let brightness = 0;

    let sharpness = 0;

    let samples = 0;

    /*
        Calculate grayscale brightness
    */

    for (
        let i = 0;
        i < data.length;
        i += 16
    ) {

        const gray =
            (
                data[i] * 0.299 +
                data[i + 1] * 0.587 +
                data[i + 2] * 0.114
            );

        brightness += gray;

        samples++;
    }

    brightness /=
        Math.max(samples, 1);

    /*
        Approximate sharpness using
        neighboring pixel differences.
    */

    const grayData =
        new Float32Array(
            canvas.width * canvas.height
        );

    for (
        let y = 0;
        y < canvas.height;
        y++
    ) {

        for (
            let x = 0;
            x < canvas.width;
            x++
        ) {

            const index =
                (y * canvas.width + x) * 4;

            grayData[
                y * canvas.width + x
            ] =
                data[index] * 0.299 +
                data[index + 1] * 0.587 +
                data[index + 2] * 0.114;
        }
    }

    let edgeSum = 0;

    let edgeCount = 0;

    for (
        let y = 1;
        y < canvas.height - 1;
        y += 2
    ) {

        for (
            let x = 1;
            x < canvas.width - 1;
            x += 2
        ) {

            const center =
                grayData[
                    y * canvas.width + x
                ];

            const right =
                grayData[
                    y * canvas.width + x + 1
                ];

            const bottom =
                grayData[
                    (y + 1) * canvas.width + x
                ];

            edgeSum +=
                Math.abs(center - right) +
                Math.abs(center - bottom);

            edgeCount++;
        }
    }

    sharpness =
        edgeSum /
        Math.max(edgeCount, 1);

    /*
        These values are intentionally not
        extremely strict.

        Lighting conditions vary.
    */

    if (brightness < 45) {

        return {
            good: false,
            message: "Too dark — improve lighting"
        };
    }

    if (brightness > 220) {

        return {
            good: false,
            message: "Too bright — avoid glare"
        };
    }

    if (sharpness < 7) {

        return {
            good: false,
            message: "Hold steady — image is blurry"
        };
    }

    return {
        good: true,
        brightness,
        sharpness
    };
}


/* ============================================================
   CENTER CROP
============================================================ */

function getCenterRegion(
    source,
    widthRatio,
    heightRatio
) {

    const cropWidth =
        source.width * widthRatio;

    const cropHeight =
        source.height * heightRatio;

    const x =
        (source.width - cropWidth) / 2;

    const y =
        (source.height - cropHeight) / 2;

    const canvas =
        document.createElement("canvas");

    canvas.width =
        Math.round(cropWidth);

    canvas.height =
        Math.round(cropHeight);

    const ctx =
        canvas.getContext("2d");

    ctx.drawImage(
        source,
        x,
        y,
        cropWidth,
        cropHeight,
        0,
        0,
        canvas.width,
        canvas.height
    );

    return canvas;
}


/* ============================================================
   CAPTURE
============================================================ */

async function captureForOCR(video) {

    if (ocrBusy) {
        return;
    }

    ocrBusy = true;

    document.getElementById("guide").className =
        "guide-frame capturing";

    document.getElementById("statusLabel").innerText =
        "Card captured — reading ID...";

    try {

        /*
            Capture the complete camera frame first.
        */

        const source =
            document.createElement("canvas");

        source.width =
            video.videoWidth;

        source.height =
            video.videoHeight;

        const sourceCtx =
            source.getContext("2d");

        sourceCtx.drawImage(
            video,
            0,
            0,
            source.width,
            source.height
        );

        /*
            IMPORTANT:

            OCR only receives the area inside
            the guide.

            This greatly reduces unrelated text.
        */

        let card =
            getCenterRegion(
                source,
                0.88,
                0.55
            );

        /*
            Limit extremely large images.
        */

        if (card.width > OCR_MAX_WIDTH) {

            const scale =
                OCR_MAX_WIDTH /
                card.width;

            const resized =
                document.createElement("canvas");

            resized.width =
                Math.round(
                    card.width * scale
                );

            resized.height =
                Math.round(
                    card.height * scale
                );

            resized
                .getContext("2d")
                .drawImage(
                    card,
                    0,
                    0,
                    resized.width,
                    resized.height
                );

            card = resized;
        }

        show(
            "Reading ID card...\n\n" +
            "Please hold steady.",
            "info"
        );

        const result =
            await runOCR(card);

        if (!result.text || result.text.length < 10) {

            throw new Error(
                "Not enough readable text"
            );
        }

        collected.raw =
            result.text;

        collected.fullName =
            result.name;

        document.getElementById("edit-id").value =
            collected.oscaId;

        document.getElementById("edit-name").value =
            collected.fullName;

        document.getElementById("edit-raw").value =
            collected.raw;

        if (collected.fullName) {

            show(
                "ID card read successfully.\n\n" +
                "Please verify the name before saving.",
                "success"
            );

        } else {

            show(
                "The ID card was captured, but the name could not be identified reliably.\n\n" +
                "Please enter or correct the name manually.",
                "warning"
            );
        }

        stopCamera();

        setStep(3);

    } catch (error) {

        console.error(
            "OCR error:",
            error
        );

        document.getElementById("guide").className =
            "guide-frame error";

        document.getElementById("statusLabel").innerText =
            "Could not read — reposition the card";

        show(
            "The card could not be read clearly.\n\n" +
            "Please place the card inside the frame and try again.",
            "warning"
        );

        goodFrameCount = 0;

        startAutoDetection();

    } finally {

        ocrBusy = false;
    }
}


/* ============================================================
   OCR
============================================================ */

async function runOCR(cardCanvas) {

    /*
        Create multiple versions of the image.

        OCR accuracy can change dramatically depending
        on contrast and thresholding.
    */

    const variants = [
        preprocessNormal(cardCanvas),
        preprocessHighContrast(cardCanvas),
        preprocessThreshold(cardCanvas)
    ];

    let best = {
        text: "",
        confidence: 0,
        name: "",
        score: 0
    };

    for (
        let i = 0;
        i < variants.length;
        i++
    ) {

        const image =
            variants[i];

        show(
            "Reading ID card...\n\n" +
            "Processing image " +
            (i + 1) +
            " of " +
            variants.length,
            "info"
        );

        const result =
            await Tesseract.recognize(
                image,
                "eng",
                {
                    logger: message => {

                        if (
                            message.status ===
                            "recognizing text"
                        ) {

                            const progress =
                                Math.round(
                                    message.progress * 100
                                );

                            document.getElementById(
                                "result"
                            ).innerText =
                                "Reading ID card...\n\n" +
                                progress +
                                "%";
                        }
                    },

                    /*
                        Single-block mode is useful
                        for ID-card text.
                    */

                    tessedit_pageseg_mode: "6"
                }
            );

        const text =
            normalizeOCRText(
                result.data.text
            );

        const confidence =
            Number(
                result.data.confidence || 0
            );

        const name =
            extractName(text);

        /*
            Prefer:
            - longer readable text
            - higher confidence
            - a detected name
        */

        let score =
            text.length +
            confidence;

        if (name) {
            score += 30;
        }

        if (
            score > best.score
        ) {

            best = {
                text,
                confidence,
                name,
                score
            };
        }
    }

    return best;
}


/* ============================================================
   OCR PREPROCESSING
============================================================ */

function preprocessNormal(source) {

    const canvas =
        cloneCanvas(source);

    const ctx =
        canvas.getContext("2d");

    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const data =
        image.data;

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const gray =
            data[i] * 0.299 +
            data[i + 1] * 0.587 +
            data[i + 2] * 0.114;

        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;
    }

    ctx.putImageData(
        image,
        0,
        0
    );

    return canvas.toDataURL(
        "image/png"
    );
}


function preprocessHighContrast(source) {

    const canvas =
        cloneCanvas(source);

    const ctx =
        canvas.getContext("2d");

    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const data =
        image.data;

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        let gray =
            data[i] * 0.299 +
            data[i + 1] * 0.587 +
            data[i + 2] * 0.114;

        /*
            Contrast enhancement
        */

        gray =
            ((gray - 128) * 1.5) + 128;

        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );

        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;
    }

    ctx.putImageData(
        image,
        0,
        0
    );

    return canvas.toDataURL(
        "image/png"
    );
}


function preprocessThreshold(source) {

    const canvas =
        cloneCanvas(source);

    const ctx =
        canvas.getContext("2d");

    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );

    const data =
        image.data;

    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        const gray =
            data[i] * 0.299 +
            data[i + 1] * 0.587 +
            data[i + 2] * 0.114;

        const value =
            gray > 145
                ? 255
                : 0;

        data[i] =
            value;

        data[i + 1] =
            value;

        data[i + 2] =
            value;
    }

    ctx.putImageData(
        image,
        0,
        0
    );

    return canvas.toDataURL(
        "image/png"
    );
}


function cloneCanvas(source) {

    const canvas =
        document.createElement("canvas");

    canvas.width =
        source.width;

    canvas.height =
        source.height;

    canvas
        .getContext("2d")
        .drawImage(
            source,
            0,
            0
        );

    return canvas;
}


/* ============================================================
   OCR TEXT CLEANING
============================================================ */

function normalizeOCRText(text) {

    return text
        .replace(/\r/g, "")
        .replace(/[|]/g, "I")
        .replace(/[ \t]+/g, " ")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
}


/* ============================================================
   NAME EXTRACTION
============================================================ */

function extractName(text) {

    if (!text) {
        return "";
    }

    const lines =
        text
            .split("\n")
            .map(line =>
                line
                    .replace(
                        /[^A-Za-zÑñ.\-'\s]/g,
                        " "
                    )
                    .replace(
                        /\s+/g,
                        " "
                    )
                    .trim()
            )
            .filter(
                line =>
                    line.length >= 4
            );

    /*
        Words that usually indicate
        non-name information.
    */

    const badWords =
        /OSCA|SENIOR|CITIZEN|IDENTIFICATION|IDENTITY|ID|NO|NUMBER|BIRTH|DATE|ADDRESS|PHILIPPINES|REPUBLIC|OFFICE|GENDER|SEX|AGE|VALID|SIGNATURE|CONTROL|CITY|MUNICIPALITY|PROVINCE|BARANGAY|REGION|DISTRICT|BIRTHPLACE|DATE|ISSUED|EXPIRY|EMERGENCY/i;

    const candidates = [];

    for (const line of lines) {

        if (
            badWords.test(line)
        ) {
            continue;
        }

        const words =
            line.split(" ")
                .filter(Boolean);

        /*
            A normal full name usually
            contains at least two words.
        */

        if (
            words.length < 2 ||
            words.length > 7
        ) {
            continue;
        }

        /*
            Avoid lines that contain
            mostly numbers.
        */

        if (
            /\d/.test(line)
        ) {
            continue;
        }

        /*
            Reject very long sentences.
        */

        if (
            line.length < 8 ||
            line.length > 50
        ) {
            continue;
        }

        let score = 0;

        /*
            More words can indicate
            a full name.
        */

        score +=
            words.length * 5;

        /*
            Names usually contain
            alphabetic characters.
        */

        if (
            /^[A-Za-zÑñ.\-'\s]+$/.test(line)
        ) {
            score += 15;
        }

        /*
            All-uppercase lines are
            common on IDs.
        */

        if (
            line === line.toUpperCase()
        ) {
            score += 5;
        }

        candidates.push({
            text: line,
            score
        });
    }

    if (
        candidates.length === 0
    ) {
        return "";
    }

    candidates.sort(
        (a, b) =>
            b.score - a.score
    );

    return candidates[0].text;
}


/* ============================================================
   RETAKE
============================================================ */

function retake() {

    document.getElementById("edit-name").value =
        "";

    document.getElementById("edit-raw").value =
        "";

    document.getElementById("result").className =
        "result-box";

    goodFrameCount = 0;

    ocrBusy = false;

    setStep(2);

    startCamera();

    show(
        "Place the ID card inside the frame.\n\n" +
        "Hold steady when the frame turns yellow.",
        "info"
    );
}


/* ============================================================
   SAVE
============================================================ */

async function saveFinal() {

    if (saving) {
        return;
    }

    const name =
        document
            .getElementById("edit-name")
            .value
            .trim();

    const oscaId =
        collected.oscaId.trim();

    /*
        Basic validation.
    */

    if (!oscaId) {

        show(
            "Missing OSCA ID.\n\n" +
            "Please start over and scan the QR code again.",
            "error"
        );

        return;
    }

    if (!name) {

        show(
            "Please enter the senior citizen's full name before saving.",
            "warning"
        );

        document
            .getElementById("edit-name")
            .focus();

        return;
    }

    saving = true;

    const saveButton =
        document.getElementById("btn-save");

    saveButton.disabled = true;

    show(
        "Saving attendance...",
        "info"
    );

    const now =
        new Date();

    const payload = {

        oscaId: oscaId,

        fullName: name,

        scanTime:
            now.toLocaleTimeString(),

        date:
            now.toLocaleDateString(),

        timestamp:
            now.toISOString(),

        device:
            navigator.userAgent.substring(
                0,
                150
            ),

        notes:
            "OSCA Smart Attendance - QR + OCR"
    };

    try {

        /*
            Google Apps Script commonly requires
            no-cors when called directly from a
            browser.

            IMPORTANT:

            no-cors means the browser cannot read
            the server response.

            It does NOT mean we can verify that
            the server successfully saved the data.
        */

        await fetch(
            SCRIPT_URL,
            {
                method: "POST",

                mode: "no-cors",

                headers: {
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(payload)
            }
        );

        /*
            Because no-cors hides the response,
            this only confirms that the browser
            submitted the request.

            Your Google Apps Script should therefore
            handle duplicate protection.
        */

        show(
            "Attendance submitted.\n\n" +
            "OSCA ID: " +
            oscaId +
            "\n" +
            "Name: " +
            name,
            "success"
        );

        /*
            Give the user time to see confirmation.
        */

        setTimeout(
            restart,
            3500
        );

    } catch (error) {

        console.error(
            "Save error:",
            error
        );

        saving = false;

        saveButton.disabled = false;

        show(
            "Unable to submit attendance.\n\n" +
            "Please check the internet connection.",
            "error"
        );
    }
}


/* ============================================================
   MESSAGE
============================================================ */

function show(
    message,
    type
) {

    const result =
        document.getElementById("result");

    result.className =
        "result-box show " + type;

    result.innerText =
        message;
}


/* ============================================================
   START APPLICATION
============================================================ */

window.addEventListener(
    "load",
    () => {

        restart();

    }
);


/* ============================================================
   CLEANUP
============================================================ */

window.addEventListener(
    "beforeunload",
    () => {

        stopQR();

        stopCamera();

    }
);

</script>
