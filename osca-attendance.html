<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OSCA Attendance - Accurate Mode</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 16px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.35rem; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 18px; font-size: 0.9rem; }

    .step-indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 8px;
    }
    .step {
      flex: 1;
      text-align: center;
      padding: 10px 6px;
      border-radius: 10px;
      background: #1e293b;
      font-size: 0.82rem;
      color: #94a3b8;
      font-weight: 500;
    }
    .step.active {
      background: #3b82f6;
      color: white;
    }
    .step.done {
      background: #166534;
      color: #bbf7d0;
    }

    #reader, #ocr-area {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #1e293b;
      min-height: 260px;
    }
    #ocr-area {
      display: none;
      text-align: center;
      padding: 12px;
    }
    #ocr-area video {
      width: 100%;
      border-radius: 8px;
    }
    #captured-img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }

    .result-box {
      margin-top: 16px;
      padding: 16px;
      background: #1e293b;
      border-radius: 12px;
      display: none;
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .result-box.show { display: block; }
    .success { border-left: 4px solid #22c55e; }
    .error { border-left: 4px solid #ef4444; }
    .info { border-left: 4px solid #3b82f6; }
    .warning { border-left: 4px solid #eab308; }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn-secondary { background: #334155; color: white; }
    .btn-danger { background: #dc2626; color: white; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .info-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 14px;
      margin-top: 14px;
      font-size: 0.9rem;
    }
    .info-card div { margin-bottom: 6px; }
    .label { color: #94a3b8; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>OSCA Attendance</h1>
    <p class="subtitle">Accurate Sequential Scan</p>

    <!-- Step Indicator -->
    <div class="step-indicator">
      <div class="step active" id="step1">1. Scan QR</div>
      <div class="step" id="step2">2. Scan ID Card</div>
      <div class="step" id="step3">3. Save</div>
    </div>

    <!-- QR Scanner -->
    <div id="reader"></div>

    <!-- OCR Area -->
    <div id="ocr-area">
      <p id="ocr-status" style="color:#94a3b8; margin-bottom:10px;">Point camera at the physical ID card</p>
      <img id="captured-img">
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <!-- Result / Status -->
    <div id="result" class="result-box"></div>

    <!-- Current Data Preview -->
    <div class="info-card" id="preview-card" style="display:none;">
      <div><span class="label">QR ID:</span> <span id="preview-id">—</span></div>
      <div><span class="label">Name:</span> <span id="preview-name">—</span></div>
    </div>

    <!-- Buttons -->
    <button class="btn btn-primary" id="btn-capture" style="display:none;" onclick="captureAndOCR()">
      Capture Physical ID Card
    </button>

    <button class="btn btn-success" id="btn-save" style="display:none;" onclick="saveFinal()">
      Save Complete Attendance
    </button>

    <button class="btn btn-secondary" id="btn-restart" onclick="restartProcess()" style="display:none;">
      Start New Person
    </button>

    <button class="btn btn-danger" id="btn-reset" onclick="restartProcess()" style="margin-top:8px;">
      Reset / Cancel
    </button>
  </div>

  <script>
    // ========== PASTE YOUR GOOGLE APPS SCRIPT URL HERE ==========
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlrjeYzjjFQh3b8CFBtYc8mkPEChHley_xO2914EAGdwO0lr5Osa3zjdlfEZsWOhOj/exec";
    // ============================================================

    let html5QrCode = null;
    let videoStream = null;
    let currentStep = 1;

    // Data collected
    let collected = {
      oscaId: "",
      fullName: "",
      rawQR: "",
      rawOCR: ""
    };

    // ========== STEP CONTROL ==========
    function setStep(step) {
      currentStep = step;
      document.getElementById("step1").className = "step" + (step === 1 ? " active" : (step > 1 ? " done" : ""));
      document.getElementById("step2").className = "step" + (step === 2 ? " active" : (step > 2 ? " done" : ""));
      document.getElementById("step3").className = "step" + (step === 3 ? " active" : "");

      document.getElementById("reader").style.display = step === 1 ? "block" : "none";
      document.getElementById("ocr-area").style.display = step === 2 ? "block" : "none";
      document.getElementById("btn-capture").style.display = step === 2 ? "block" : "none";
      document.getElementById("btn-save").style.display = step === 3 ? "block" : "none";
      document.getElementById("btn-restart").style.display = step === 3 ? "block" : "none";
      document.getElementById("preview-card").style.display = step >= 2 ? "block" : "none";
    }

    function restartProcess() {
      collected = { oscaId: "", fullName: "", rawQR: "", rawOCR: "" };
      document.getElementById("preview-id").innerText = "—";
      document.getElementById("preview-name").innerText = "—";
      document.getElementById("captured-img").style.display = "none";
      document.getElementById("result").classList.remove("show");
      stopQRScanner();
      stopOCRCamera();
      setStep(1);
      startQRScanner();
      showResult("Ready. Please scan the QR code first.", "info");
    }

    // ========== QR SCANNING (STEP 1) ==========
    function onScanSuccess(decodedText) {
      if (currentStep !== 1) return;

      stopQRScanner();

      let oscaId = "";
      const text = decodedText.trim();

      if (text.includes("Senior_citizen_id=")) {
        oscaId = text.split("Senior_citizen_id=")[1].trim();
      } else if (/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i.test(text)) {
        oscaId = text.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i)[0];
      } else {
        oscaId = text;
      }

      collected.oscaId = oscaId;
      collected.rawQR = text;
      document.getElementById("preview-id").innerText = oscaId;

      showResult("QR successfully scanned!\n\nID: " + oscaId + "\n\nNow please scan the Physical ID card.", "success");
      setStep(2);
      startOCRCamera();
    }

    function startQRScanner() {
      if (html5QrCode) return;
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      Html5Qrcode.getCameras().then(cameras => {
        if (cameras && cameras.length) {
          const cameraId = cameras[cameras.length - 1].id;
          html5QrCode.start(cameraId, config, onScanSuccess, () => {});
        } else {
          showResult("No camera found", "error");
        }
      }).catch(err => showResult("Camera error: " + err, "error"));
    }

    function stopQRScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
        }).catch(() => { html5QrCode = null; });
      }
    }

    // ========== PHYSICAL ID OCR (STEP 2) ==========
    async function startOCRCamera() {
      const area = document.getElementById("ocr-area");
      try {
        if (videoStream) {
          videoStream.getTracks().forEach(t => t.stop());
        }

        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });

        area.innerHTML = "";
        const video = document.createElement("video");
        video.srcObject = videoStream;
        video.setAttribute("playsinline", true);
        video.setAttribute("autoplay", true);
        video.style.width = "100%";
        video.style.borderRadius = "8px";
        video.play();
        area.appendChild(video);

        const status = document.createElement("p");
        status.id = "ocr-status";
        status.style.color = "#94a3b8";
        status.style.margin = "10px 0";
        status.innerText = "Point at the ID card → then tap Capture";
        area.appendChild(status);

        const img = document.createElement("img");
        img.id = "captured-img";
        img.style.maxWidth = "100%";
        img.style.borderRadius = "8px";
        img.style.display = "none";
        area.appendChild(img);

        const canvas = document.createElement("canvas");
        canvas.id = "canvas";
        canvas.style.display = "none";
        area.appendChild(canvas);

      } catch (err) {
        showResult("Cannot access camera: " + err.message, "error");
      }
    }

    function stopOCRCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
        videoStream = null;
      }
    }

    async function captureAndOCR() {
      const video = document.querySelector("#ocr-area video");
      if (!video || video.videoWidth === 0) {
        showResult("Camera not ready. Wait a moment and try again.", "error");
        return;
      }

      showResult("Capturing photo...", "info");

      try {
        const canvas = document.getElementById("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0);

        const imgData = canvas.toDataURL("image/jpeg", 0.85);
        const img = document.getElementById("captured-img");
        img.src = imgData;
        img.style.display = "block";

        showResult("Reading the ID card...\nPlease wait 5–15 seconds", "info");

        const result = await Tesseract.recognize(imgData, "eng", {
          logger: m => {
            if (m.status === "recognizing text") {
              document.getElementById("result").innerText = `Reading ID card... ${Math.round(m.progress * 100)}%`;
            }
          }
        });

        const text = result.data.text;
        collected.rawOCR = text;
        console.log("OCR:", text);

        // Extract Name (improved heuristic)
        let fullName = "";
        const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 4);

        for (let line of lines.slice(0, 15)) {
          // Skip common labels
          if (/OSCA|SENIOR|CITIZEN|ID|NO\.|BIRTH|DATE|ADDRESS|PHILIPPINES|REPUBLIC|OFFICE|GENDER|SEX|AGE|VALID|SIGNATURE/i.test(line)) continue;
          // Look for name-like text
          if (/[A-Za-z]{3,}/.test(line) && line.length > 6 && line.length < 45) {
            fullName = line.replace(/[^A-Za-zÑñ\s\.\-]/g, "").trim();
            if (fullName.split(" ").length >= 2) break; // prefer full names
          }
        }

        collected.fullName = fullName || "Not clearly read";
        document.getElementById("preview-name").innerText = collected.fullName;

        showResult(`Physical ID read!\n\nName: ${collected.fullName}\n\nYou can now save the complete record.`, "success");
        setStep(3);
        stopOCRCamera();

      } catch (err) {
        showResult("OCR Error: " + err.message, "error");
      }
    }

    // ========== SAVE (STEP 3) ==========
    function saveFinal() {
      if (!collected.oscaId) {
        showResult("No QR ID found. Please restart.", "error");
        return;
      }

      showResult("Saving to Google Sheets...", "info");

      const now = new Date();
      const payload = {
        oscaId: collected.oscaId,
        fullName: collected.fullName,
        scanTime: now.toLocaleTimeString(),
        date: now.toLocaleDateString(),
        device: navigator.userAgent.substring(0, 50),
        notes: "QR+OCR | " + (collected.rawOCR ? collected.rawOCR.substring(0, 80) : "")
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(() => {
        showResult("Successfully saved!\n\nID: " + collected.oscaId + "\nName: " + collected.fullName, "success");
        setTimeout(() => restartProcess(), 4000);
      }).catch(() => {
        showResult("Failed to save. Check internet / Apps Script URL.", "error");
      });
    }

    function showResult(msg, type) {
      const box = document.getElementById("result");
      box.className = "result-box show " + type;
      box.innerText = msg;
    }

    // Start
    window.addEventListener("load", () => {
      restartProcess();
    });
  </script>
</body>
</html>
