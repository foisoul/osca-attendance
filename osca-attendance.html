<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OSCA Attendance Scanner</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 16px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.4rem; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 16px; font-size: 0.9rem; }
    
    .mode-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .mode-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      background: #1e293b;
      color: #94a3b8;
    }
    .mode-btn.active {
      background: #3b82f6;
      color: white;
    }

    #reader, #ocr-preview {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #1e293b;
      min-height: 280px;
    }
    #ocr-preview {
      display: none;
      text-align: center;
      padding: 12px;
    }
    #ocr-preview video {
      width: 100%;
      border-radius: 8px;
    }
    #captured-img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }

    .result-box {
      margin-top: 16px;
      padding: 16px;
      background: #1e293b;
      border-radius: 12px;
      display: none;
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .result-box.show { display: block; }
    .success { border-left: 4px solid #22c55e; }
    .error { border-left: 4px solid #ef4444; }
    .info { border-left: 4px solid #3b82f6; }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-secondary { background: #334155; color: white; }
    .btn-success { background: #22c55e; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .manual-section {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #334155;
    }
    label { font-size: 0.85rem; color: #94a3b8; display: block; margin-top: 10px; }
    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OSCA Attendance</h1>
    <p class="subtitle">Scan QR or Physical ID Card</p>

    <div class="mode-buttons">
      <button class="mode-btn active" id="btn-qr" onclick="switchMode('qr')">QR Code</button>
      <button class="mode-btn" id="btn-ocr" onclick="switchMode('ocr')">Physical ID</button>
    </div>

    <div id="reader"></div>

    <div id="ocr-preview">
      <p id="ocr-status" style="color:#94a3b8; margin-bottom:10px;">Camera starting...</p>
      <img id="captured-img">
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div id="result" class="result-box"></div>

    <button class="btn btn-primary" id="capture-btn" style="display:none;" onclick="captureAndOCR()">
      Capture & Read ID Card
    </button>

    <button class="btn btn-secondary" onclick="toggleManual()">Manual Entry</button>

    <div id="manual" class="manual-section" style="display:none;">
      <label>OSCA ID / Number</label>
      <input type="text" id="manualId" placeholder="Enter ID">
      
      <label>Full Name (optional)</label>
      <input type="text" id="manualName" placeholder="Enter Full Name">
      
      <label>Notes</label>
      <textarea id="manualNotes" rows="2" placeholder="Any notes..."></textarea>
      
      <button class="btn btn-success" onclick="submitManual()">Save Attendance</button>
    </div>
  </div>

  <script>
    // ========== PASTE YOUR GOOGLE APPS SCRIPT URL HERE ==========
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfw1-WPYoWxFGE6U3MXKhxVTP94-ibxdWLT26xxyYPKxMrQgDTgmR3Vcut0d11l-3x/exec";
    // ============================================================

    let html5QrCode = null;
    let currentMode = "qr";
    let isScanning = true;
    let videoStream = null;

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById("btn-qr").classList.toggle("active", mode === "qr");
      document.getElementById("btn-ocr").classList.toggle("active", mode === "ocr");
      document.getElementById("reader").style.display = mode === "qr" ? "block" : "none";
      document.getElementById("ocr-preview").style.display = mode === "ocr" ? "block" : "none";
      document.getElementById("capture-btn").style.display = mode === "ocr" ? "block" : "none";
      document.getElementById("result").classList.remove("show");
      document.getElementById("captured-img").style.display = "none";

      if (mode === "qr") {
        stopOCRCamera();
        startQRScanner();
      } else {
        stopQRScanner();
        startOCRCamera();
      }
    }

    // ========== QR MODE ==========
    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false;
      if (html5QrCode) html5QrCode.pause(true);

      let oscaId = "";
      const text = decodedText.trim();

      if (text.includes("Senior_citizen_id=")) {
        oscaId = text.split("Senior_citizen_id=")[1].trim();
      } else if (/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i.test(text)) {
        oscaId = text.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i)[0];
      } else {
        oscaId = text;
      }

      showResult("QR Scanned!\n\nID: " + oscaId, "info");
      sendToSheet(oscaId, "", text);
    }

    function startQRScanner() {
      if (html5QrCode) return;
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };

      Html5Qrcode.getCameras().then(cameras => {
        if (cameras && cameras.length) {
          const cameraId = cameras[cameras.length - 1].id;
          html5QrCode.start(cameraId, config, onScanSuccess, () => {});
        } else {
          showResult("No camera found", "error");
        }
      }).catch(err => showResult("Camera error: " + err, "error"));
    }

    function stopQRScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
        }).catch(() => {
          html5QrCode = null;
        });
      }
    }

    // ========== OCR MODE ==========
    async function startOCRCamera() {
      const preview = document.getElementById("ocr-preview");
      const status = document.getElementById("ocr-status");

      try {
        // Stop any previous stream
        if (videoStream) {
          videoStream.getTracks().forEach(track => track.stop());
        }

        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });

        // Clear previous content
        preview.innerHTML = "";
        
        const video = document.createElement("video");
        video.srcObject = videoStream;
        video.setAttribute("playsinline", true);
        video.setAttribute("autoplay", true);
        video.style.width = "100%";
        video.style.borderRadius = "8px";
        video.play();

        preview.appendChild(video);
        
        // Re-add status and image elements
        const statusP = document.createElement("p");
        statusP.id = "ocr-status";
        statusP.style.color = "#94a3b8";
        statusP.style.margin = "10px 0";
        statusP.innerText = "Point at the ID card, then tap Capture";
        preview.appendChild(statusP);

        const img = document.createElement("img");
        img.id = "captured-img";
        img.style.maxWidth = "100%";
        img.style.borderRadius = "8px";
        img.style.display = "none";
        preview.appendChild(img);

        const canvas = document.createElement("canvas");
        canvas.id = "canvas";
        canvas.style.display = "none";
        preview.appendChild(canvas);

      } catch (err) {
        showResult("Cannot access camera.\n\nPlease allow camera permission and try again.\n\nError: " + err.message, "error");
      }
    }

    function stopOCRCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
    }

    async function captureAndOCR() {
      const video = document.querySelector("#ocr-preview video");
      
      if (!video) {
        showResult("Camera not ready. Please switch to Physical ID mode again.", "error");
        return;
      }

      if (video.videoWidth === 0 || video.videoHeight === 0) {
        showResult("Camera is still loading.\nWait 1–2 seconds and try again.", "error");
        return;
      }

      showResult("Capturing photo...", "info");

      try {
        const canvas = document.getElementById("canvas") || document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imgData = canvas.toDataURL("image/jpeg", 0.85);

        // Show the captured image
        let img = document.getElementById("captured-img");
        if (img) {
          img.src = imgData;
          img.style.display = "block";
        }

        showResult("Reading the ID card...\nPlease wait (5–15 seconds)", "info");

        const result = await Tesseract.recognize(imgData, "eng", {
          logger: (m) => {
            if (m.status === "recognizing text") {
              const percent = Math.round(m.progress * 100);
              const box = document.getElementById("result");
              if (box) box.innerText = `Reading ID card... ${percent}%`;
            }
          }
        });

        const text = result.data.text;
        console.log("OCR Text:", text);

        let oscaId = "";
        let fullName = "";

        // Extract UUID
        const uuidMatch = text.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
        if (uuidMatch) {
          oscaId = uuidMatch[0];
        }

        // Try to find name
        const lines = text.split("\n")
          .map(l => l.trim())
          .filter(l => l.length > 5);

        for (let line of lines.slice(0, 12)) {
          if (
            /[A-Za-z]{3,}/.test(line) &&
            !/OSCA|SENIOR|CITIZEN|ID|NO\.|BIRTH|DATE|ADDRESS|PHILIPPINES|REPUBLIC|OFFICE|GENDER|SEX/i.test(line)
          ) {
            fullName = line;
            break;
          }
        }

        if (!oscaId && !fullName) {
          showResult("Could not read clearly.\n\nTips:\n• Use good lighting\n• Hold phone steady\n• Make sure Name & Number are visible\n\nRaw text:\n" + text.substring(0, 220), "error");
          return;
        }

        showResult(`Successfully Read!\n\nID: ${oscaId || "Not found"}\nName: ${fullName || "Not found"}`, "success");
        sendToSheet(oscaId || "UNKNOWN", fullName || "", text.substring(0, 120));

      } catch (err) {
        console.error(err);
        showResult("Error while reading:\n" + err.message, "error");
      }
    }

    // ========== COMMON FUNCTIONS ==========
    function sendToSheet(oscaId, fullName, raw = "") {
      const now = new Date();
      const payload = {
        oscaId: oscaId,
        fullName: fullName || "",
        scanTime: now.toLocaleTimeString(),
        date: now.toLocaleDateString(),
        device: navigator.userAgent.substring(0, 60),
        notes: raw ? "Raw: " + raw.substring(0, 100) : ""
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(() => {
        setTimeout(() => {
          isScanning = true;
          if (currentMode === "qr" && html5QrCode) {
            try { html5QrCode.resume(); } catch(e) {}
          }
          document.getElementById("result").classList.remove("show");
        }, 3500);
      }).catch(() => {
        showResult("Failed to save. Check internet connection.", "error");
        isScanning = true;
      });
    }

    function showResult(msg, type) {
      const box = document.getElementById("result");
      box.className = "result-box show " + type;
      box.innerText = msg;
    }

    function toggleManual() {
      const el = document.getElementById("manual");
      el.style.display = el.style.display === "block" ? "none" : "block";
    }

    function submitManual() {
      const id = document.getElementById("manualId").value.trim();
      const name = document.getElementById("manualName").value.trim();
      const notes = document.getElementById("manualNotes").value.trim();
      if (!id) {
        alert("Please enter OSCA ID");
        return;
      }
      sendToSheet(id, name, notes);
      document.getElementById("manualId").value = "";
      document.getElementById("manualName").value = "";
      document.getElementById("manualNotes").value = "";
    }

    // Start with QR mode
    window.addEventListener("load", () => {
      startQRScanner();
    });
  </script>
</body>
</html>
