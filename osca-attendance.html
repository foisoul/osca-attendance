<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OSCA Attendance – Production</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 16px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.3rem; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #94a3b8; font-size: 0.88rem; margin-bottom: 18px; }

    .steps {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
    }
    .step {
      flex: 1;
      text-align: center;
      padding: 9px 4px;
      border-radius: 8px;
      background: #1e293b;
      font-size: 0.78rem;
      color: #94a3b8;
    }
    .step.active { background: #3b82f6; color: white; }
    .step.done { background: #166534; color: #bbf7d0; }

    #reader, #camera-box {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #1e293b;
      min-height: 260px;
      position: relative;
    }
    #camera-box { display: none; }
    #camera-box video { width: 100%; display: block; }

    .guide {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 88%; height: 56%;
      border: 3px solid #22c55e;
      border-radius: 10px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.4);
    }
    .guide-label {
      position: absolute;
      bottom: 12px; left: 0; right: 0;
      text-align: center;
      color: white;
      font-size: 0.85rem;
      text-shadow: 0 1px 3px black;
      pointer-events: none;
    }

    .preview-img {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }

    .result {
      margin-top: 14px;
      padding: 14px;
      background: #1e293b;
      border-radius: 11px;
      display: none;
      white-space: pre-wrap;
      font-size: 0.92rem;
      line-height: 1.4;
    }
    .result.show { display: block; }
    .success { border-left: 4px solid #22c55e; }
    .error { border-left: 4px solid #ef4444; }
    .info { border-left: 4px solid #3b82f6; }
    .warning { border-left: 4px solid #eab308; }

    .form-box {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
      display: none;
    }
    .form-box label {
      display: block;
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 4px;
      margin-top: 10px;
    }
    .form-box label:first-child { margin-top: 0; }
    .form-box input, .form-box textarea {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 1rem;
    }
    .form-box input:focus, .form-box textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn-warning { background: #d97706; color: white; }
    .btn-secondary { background: #334155; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .hint {
      text-align: center;
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OSCA Attendance</h1>
    <p class="subtitle">Reliable QR + ID Card Capture</p>

    <div class="steps">
      <div class="step active" id="s1">1. QR</div>
      <div class="step" id="s2">2. Photo</div>
      <div class="step" id="s3">3. Confirm</div>
    </div>

    <!-- Step 1: QR -->
    <div id="reader"></div>

    <!-- Step 2: Camera -->
    <div id="camera-box">
      <video id="video" autoplay playsinline muted></video>
      <div class="guide"></div>
      <div class="guide-label">Align the ID card inside the green frame</div>
    </div>

    <img id="preview" class="preview-img" alt="Captured ID">

    <div id="result" class="result"></div>

    <!-- Step 3: Confirmation Form -->
    <div class="form-box" id="form-box">
      <label>OSCA ID (from QR)</label>
      <input type="text" id="field-id" readonly>

      <label>Full Name *</label>
      <input type="text" id="field-name" placeholder="Enter or correct the name">

      <label>Birthday (optional)</label>
      <input type="text" id="field-bday" placeholder="e.g. 1950-05-12">

      <label>Address / Barangay (optional)</label>
      <input type="text" id="field-address" placeholder="Barangay or address">

      <label>Notes</label>
      <textarea id="field-notes" rows="2" placeholder="Any additional notes"></textarea>

      <label>Raw OCR Text (for reference)</label>
      <textarea id="field-raw" rows="4" style="font-size:0.82rem; color:#94a3b8;"></textarea>
    </div>

    <button class="btn btn-primary" id="btn-capture" style="display:none;" onclick="capturePhoto()">
      Capture ID Card
    </button>
    <button class="btn btn-warning" id="btn-retake" style="display:none;" onclick="retakePhoto()">
      Retake Photo
    </button>
    <button class="btn btn-success" id="btn-save" style="display:none;" onclick="saveData()">
      Save Attendance
    </button>
    <button class="btn btn-secondary" onclick="restart()">
      Start Over
    </button>

    <p class="hint">Always verify the name before saving.</p>
  </div>

  <script>
    // ========== PASTE YOUR GOOGLE APPS SCRIPT URL ==========
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHfbd6o1Sy-uUi3RpnvU0gxcT6hvPhLoEIbUIRLteW_n4RjwzazjGSAY62WCtLOSAG/exec";
    // ======================================================

    let html5QrCode = null;
    let stream = null;
    let step = 1;
    let data = { oscaId: "", fullName: "", raw: "" };

    function setStep(n) {
      step = n;
      document.getElementById("s1").className = "step" + (n===1?" active":n>1?" done":"");
      document.getElementById("s2").className = "step" + (n===2?" active":n>2?" done":"");
      document.getElementById("s3").className = "step" + (n===3?" active":"");

      document.getElementById("reader").style.display = n===1 ? "block" : "none";
      document.getElementById("camera-box").style.display = n===2 ? "block" : "none";
      document.getElementById("btn-capture").style.display = n===2 ? "block" : "none";
      document.getElementById("btn-retake").style.display = n===3 ? "block" : "none";
      document.getElementById("btn-save").style.display = n===3 ? "block" : "none";
      document.getElementById("form-box").style.display = n===3 ? "block" : "none";
      document.getElementById("preview").style.display = n===3 ? "block" : "none";
    }

    function restart() {
      stopQR();
      stopCamera();
      data = { oscaId: "", fullName: "", raw: "" };
      document.getElementById("result").className = "result";
      document.getElementById("preview").src = "";
      document.getElementById("field-id").value = "";
      document.getElementById("field-name").value = "";
      document.getElementById("field-bday").value = "";
      document.getElementById("field-address").value = "";
      document.getElementById("field-notes").value = "";
      document.getElementById("field-raw").value = "";
      setStep(1);
      startQR();
      show("Step 1: Scan the OSCA QR code", "info");
    }

    // ===== QR =====
    function startQR() {
      if (html5QrCode) return;
      html5QrCode = new Html5Qrcode("reader");
      Html5Qrcode.getCameras().then(cameras => {
        if (!cameras.length) {
          show("No camera found", "error");
          return;
        }
        const cam = cameras[cameras.length - 1];
        html5QrCode.start(cam.id, { fps: 10, qrbox: { width: 250, height: 250 } }, onQR, () => {});
      }).catch(err => show("Camera error: " + err.message, "error"));
    }

    function stopQR() {
      if (!html5QrCode) return;
      const s = html5QrCode;
      html5QrCode = null;
      s.stop().then(() => s.clear()).catch(() => {});
    }

    function onQR(text) {
      if (step !== 1) return;
      stopQR();

      let id = text.trim();
      if (id.includes("Senior_citizen_id=")) {
        id = id.split("Senior_citizen_id=")[1].trim();
      } else {
        const m = id.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
        if (m) id = m[0];
      }

      data.oscaId = id;
      show("QR captured!\n\nOSCA ID: " + id + "\n\nNow take a clear photo of the physical ID card.", "success");
      setStep(2);
      startCamera();
    }

    // ===== Camera =====
    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        const video = document.getElementById("video");
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        show("Cannot access camera.\nPlease allow permission.\n\n" + err.message, "error");
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      const video = document.getElementById("video");
      if (video) video.srcObject = null;
    }

    // ===== Capture + OCR =====
    async function capturePhoto() {
      const video = document.getElementById("video");
      if (!video || video.videoWidth === 0) {
        show("Camera not ready. Please wait a moment.", "warning");
        return;
      }

      show("Capturing photo and reading text...\nPlease wait.", "info");

      // Capture high quality
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0);

      // Show preview
      const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
      const preview = document.getElementById("preview");
      preview.src = dataUrl;
      preview.style.display = "block";

      try {
        // Run OCR
        const result = await Tesseract.recognize(dataUrl, "eng", {
          logger: m => {
            if (m.status === "recognizing text") {
              document.getElementById("result").innerText =
                "Reading ID card... " + Math.round(m.progress * 100) + "%";
            }
          }
        });

        const rawText = result.data.text.trim();
        data.raw = rawText;

        // Simple name extraction
        const name = extractName(rawText);
        data.fullName = name;

        // Fill form
        document.getElementById("field-id").value = data.oscaId;
        document.getElementById("field-name").value = name || "";
        document.getElementById("field-raw").value = rawText;

        stopCamera();
        setStep(3);

        if (name && name.length > 5) {
          show("Photo captured and text read.\n\nPlease verify and correct the name if needed, then save.", "success");
        } else {
          show("Photo captured, but name was not clearly detected.\n\nPlease type the correct full name.", "warning");
          document.getElementById("field-name").focus();
        }

      } catch (err) {
        show("OCR failed: " + err.message + "\n\nYou can still type the name manually.", "error");
        document.getElementById("field-id").value = data.oscaId;
        document.getElementById("field-raw").value = "";
        stopCamera();
        setStep(3);
      }
    }

    function extractName(text) {
      if (!text) return "";
      const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 3);
      const skip = /OSCA|SENIOR|CITIZEN|ID|NO\.|NUMBER|BIRTH|DATE|ADDRESS|PHILIPPINES|REPUBLIC|OFFICE|GENDER|SEX|AGE|VALID|SIGNATURE|CONTROL|CITY|MUNICIPALITY|PROVINCE|BARANGAY|REGION|NATIONAL|GOVERNMENT/i;

      let best = "";
      for (let line of lines) {
        if (skip.test(line)) continue;
        if (!/[A-Za-zÑñ]{3,}/.test(line)) continue;
        let clean = line.replace(/[^A-Za-zÑñ\s\.\-']/g, " ").replace(/\s+/g, " ").trim();
        if (clean.split(" ").length >= 2 && clean.length >= 8 && clean.length <= 50) {
          if (clean.length > best.length) best = clean;
        }
      }
      return best;
    }

    function retakePhoto() {
      document.getElementById("preview").style.display = "none";
      document.getElementById("field-name").value = "";
      document.getElementById("field-raw").value = "";
      setStep(2);
      startCamera();
      show("Align the ID card and capture again.", "info");
    }

    // ===== Save =====
    async function saveData() {
      const name = document.getElementById("field-name").value.trim();
      const bday = document.getElementById("field-bday").value.trim();
      const address = document.getElementById("field-address").value.trim();
      const notes = document.getElementById("field-notes").value.trim();

      if (!data.oscaId) {
        show("Missing OSCA ID. Please start over.", "error");
        return;
      }
      if (!name) {
        show("Please enter the Full Name before saving.", "warning");
        document.getElementById("field-name").focus();
        return;
      }

      const btn = document.getElementById("btn-save");
      btn.disabled = true;
      show("Saving to Google Sheets...", "info");

      const now = new Date();
      const payload = {
        oscaId: data.oscaId,
        fullName: name,
        birthday: bday,
        address: address,
        scanTime: now.toLocaleTimeString(),
        date: now.toLocaleDateString(),
        device: navigator.userAgent.substring(0, 80),
        notes: notes || "QR + Photo OCR",
        rawOCR: data.raw ? data.raw.substring(0, 300) : ""
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        show("Attendance saved successfully!\n\nID: " + data.oscaId + "\nName: " + name, "success");
        setTimeout(restart, 3500);
      } catch (err) {
        show("Failed to save. Check internet connection.", "error");
        btn.disabled = false;
      }
    }

    function show(msg, type) {
      const el = document.getElementById("result");
      el.className = "result show " + type;
      el.innerText = msg;
    }

    // Start
    window.addEventListener("load", restart);
    window.addEventListener("beforeunload", () => {
      stopQR();
      stopCamera();
    });
  </script>
</body>
</html>
