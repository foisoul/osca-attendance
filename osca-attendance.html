<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OSCA Attendance - Smart Reader</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 14px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.25rem; margin-bottom: 2px; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 14px; font-size: 0.84rem; }

    .step-indicator { display: flex; gap: 6px; margin-bottom: 14px; }
    .step {
      flex: 1; text-align: center; padding: 8px 4px;
      border-radius: 8px; background: #1e293b; font-size: 0.75rem; color: #94a3b8;
    }
    .step.active { background: #3b82f6; color: white; }
    .step.done { background: #166534; color: #bbf7d0; }

    #reader, #ocr-area {
      width: 100%; border-radius: 12px; overflow: hidden;
      background: #1e293b; min-height: 240px; position: relative;
    }
    #ocr-area { display: none; }
    #ocr-area video { width: 100%; display: block; }

    .guide-frame {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 87%; height: 56%;
      border: 3px solid #22c55e;
      border-radius: 10px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.38);
    }
    .guide-label {
      position: absolute; bottom: 10px; left: 0; right: 0;
      text-align: center; color: white; font-size: 0.84rem;
      text-shadow: 0 1px 4px black; pointer-events: none;
    }

    .result-box {
      margin-top: 12px; padding: 13px; background: #1e293b;
      border-radius: 11px; display: none; white-space: pre-wrap;
      font-size: 0.9rem; line-height: 1.4;
    }
    .result-box.show { display: block; }
    .success { border-left: 4px solid #22c55e; }
    .error { border-left: 4px solid #ef4444; }
    .info { border-left: 4px solid #3b82f6; }
    .warning { border-left: 4px solid #eab308; }

    .btn {
      display: block; width: 100%; padding: 13px; margin-top: 9px;
      border: none; border-radius: 10px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn-warning { background: #d97706; color: white; }
    .btn-secondary { background: #334155; color: white; }

    .edit-box {
      background: #1e293b; border-radius: 11px; padding: 13px;
      margin-top: 11px; display: none;
    }
    .edit-box label { font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 3px; }
    .edit-box input, .edit-box textarea {
      width: 100%; padding: 10px; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: white;
      font-size: 0.95rem; margin-bottom: 9px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OSCA Attendance</h1>
    <p class="subtitle">Smart Reader</p>

    <div class="step-indicator">
      <div class="step active" id="step1">1. QR</div>
      <div class="step" id="step2">2. ID Card</div>
      <div class="step" id="step3">3. Confirm</div>
    </div>

    <div id="reader"></div>

    <div id="ocr-area">
      <div class="guide-frame"></div>
      <div class="guide-label">Place the ID card inside the green frame</div>
    </div>

    <div id="result" class="result-box"></div>

    <div class="edit-box" id="edit-box">
      <label>OSCA ID (from QR)</label>
      <input type="text" id="edit-id" readonly>

      <label>Full Name (you can edit)</label>
      <input type="text" id="edit-name" placeholder="Detected name">

      <label>Raw detected text</label>
      <textarea id="edit-raw" rows="3" style="font-size:0.8rem; color:#94a3b8;"></textarea>
    </div>

    <button class="btn btn-primary" id="btn-capture" style="display:none;" onclick="smartCapture()">
      Smart Capture
    </button>
    <button class="btn btn-warning" id="btn-retake" style="display:none;" onclick="retake()">
      Retake
    </button>
    <button class="btn btn-success" id="btn-save" style="display:none;" onclick="saveFinal()">
      Save Attendance
    </button>
    <button class="btn btn-secondary" onclick="restart()">Start Over</button>
  </div>

  <script>
    // ========== PASTE YOUR REAL GOOGLE SCRIPT URL ==========
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlrjeYzjjFQh3b8CFBtYc8mkPEChHley_xO2914EAGdwO0lr5Osa3zjdlfEZsWOhOj/exec";
    // ======================================================

    let html5QrCode = null;
    let videoStream = null;
    let currentStep = 1;
    let collected = { oscaId: "", fullName: "", raw: "" };

    function setStep(s) {
      currentStep = s;
      document.getElementById("step1").className = "step" + (s===1?" active":s>1?" done":"");
      document.getElementById("step2").className = "step" + (s===2?" active":s>2?" done":"");
      document.getElementById("step3").className = "step" + (s===3?" active":"");
      document.getElementById("reader").style.display = s===1 ? "block" : "none";
      document.getElementById("ocr-area").style.display = s===2 ? "block" : "none";
      document.getElementById("btn-capture").style.display = s===2 ? "block" : "none";
      document.getElementById("btn-retake").style.display = s===3 ? "block" : "none";
      document.getElementById("btn-save").style.display = s===3 ? "block" : "none";
      document.getElementById("edit-box").style.display = s===3 ? "block" : "none";
    }

    function restart() {
      collected = { oscaId: "", fullName: "", raw: "" };
      document.getElementById("result").classList.remove("show");
      document.getElementById("edit-id").value = "";
      document.getElementById("edit-name").value = "";
      document.getElementById("edit-raw").value = "";
      stopQR(); stopCam();
      setStep(1);
      startQR();
      show("Step 1: Scan the QR code", "info");
    }

    // ===== QR =====
    function onQR(text) {
      if (currentStep !== 1) return;
      stopQR();
      let id = text.trim();
      if (id.includes("Senior_citizen_id=")) id = id.split("Senior_citizen_id=")[1].trim();
      else {
        const m = id.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
        if (m) id = m[0];
      }
      collected.oscaId = id;
      show("QR captured!\n\nNow place the physical ID card inside the green frame and tap Smart Capture.", "success");
      setStep(2);
      startCam();
    }

    function startQR() {
      if (html5QrCode) return;
      html5QrCode = new Html5Qrcode("reader");
      Html5Qrcode.getCameras().then(c => {
        if (c.length) html5QrCode.start(c[c.length-1].id, {fps:10, qrbox:{width:250,height:250}}, onQR, ()=>{});
      });
    }
    function stopQR() {
      if (html5QrCode) html5QrCode.stop().then(()=>{html5QrCode.clear();html5QrCode=null;}).catch(()=>{html5QrCode=null;});
    }

    // ===== Camera =====
    async function startCam() {
      const area = document.getElementById("ocr-area");
      try {
        if (videoStream) videoStream.getTracks().forEach(t => t.stop());
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width:{ideal:1280}, height:{ideal:720} }
        });
        const old = area.querySelector("video");
        if (old) old.remove();
        const v = document.createElement("video");
        v.srcObject = videoStream;
        v.setAttribute("playsinline", true);
        v.autoplay = true;
        v.style.width = "100%";
        v.play();
        area.insertBefore(v, area.firstChild);
      } catch(e) {
        show("Camera error: " + e.message, "error");
      }
    }
    function stopCam() {
      if (videoStream) { videoStream.getTracks().forEach(t=>t.stop()); videoStream=null; }
    }

    // ===== SMART CAPTURE =====
    async function smartCapture() {
      const video = document.querySelector("#ocr-area video");
      if (!video || video.videoWidth === 0) {
        show("Camera not ready. Wait a second.", "warning");
        return;
      }

      show("Analyzing card position & reading...", "info");

      // Capture
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0);

      // Enhance
      const img = ctx.getImageData(0,0,canvas.width,canvas.height);
      const d = img.data;
      for (let i=0; i<d.length; i+=4) {
        const avg = (d[i]+d[i+1]+d[i+2])/3;
        const v = avg > 125 ? Math.min(255, avg*1.25) : Math.max(0, avg*0.75);
        d[i]=d[i+1]=d[i+2]=v;
      }
      ctx.putImageData(img,0,0);

      // Smart orientation decision: try 0° and 90° first (most common)
      const angles = [0, 90, 180, 270];
      let best = { text: "", score: 0, name: "", angle: 0 };

      for (let angle of angles) {
        const rotated = rotate(canvas, angle);
        const url = rotated.toDataURL("image/jpeg", 0.88);

        try {
          const res = await Tesseract.recognize(url, "eng", {
            logger: m => {
              if (m.status === "recognizing text") {
                document.getElementById("result").innerText = `Reading (${angle}°) ${Math.round(m.progress*100)}%`;
              }
            }
          });

          const text = res.data.text.trim();
          const conf = res.data.confidence || 0;
          const score = text.length * 0.6 + conf * 0.4;

          if (score > best.score && text.length > 18) {
            best = {
              text: text,
              score: score,
              name: extractSmartName(text),
              angle: angle
            };
          }
        } catch(e) {}
      }

      if (best.score < 25 || best.text.length < 20) {
        show("Reading quality too low.\n\nPlease retake:\n• Better lighting\n• Fill the green frame\n• Hold steady", "error");
        return;
      }

      collected.raw = best.text;
      collected.fullName = best.name;

      document.getElementById("edit-id").value = collected.oscaId;
      document.getElementById("edit-name").value = best.name || "";
      document.getElementById("edit-raw").value = best.text;

      if (!best.name || best.name.length < 6) {
        show("Text read successfully but name is unclear.\nPlease type the correct name.", "warning");
      } else {
        show(`Good reading (orientation ${best.angle}°)\n\nPlease verify the name.`, "success");
      }

      setStep(3);
      stopCam();
    }

    function rotate(src, deg) {
      const rad = deg * Math.PI / 180;
      const w = src.width, h = src.height;
      const c = document.createElement("canvas");
      if (deg % 180 === 0) { c.width = w; c.height = h; }
      else { c.width = h; c.height = w; }
      const ctx = c.getContext("2d");
      ctx.translate(c.width/2, c.height/2);
      ctx.rotate(rad);
      ctx.drawImage(src, -w/2, -h/2);
      return c;
    }

    function extractSmartName(text) {
      const lines = text.split(/\n/).map(l => l.trim()).filter(l => l.length > 3);
      const bad = /OSCA|SENIOR|CITIZEN|ID|NO\.|NUMBER|BIRTH|DATE|ADDRESS|PHILIPPINES|REPUBLIC|OFFICE|GENDER|SEX|AGE|VALID|SIGNATURE|CONTROL|CITY|MUNICIPALITY|PROVINCE|BARANGAY|REGION|NATIONAL|GOVERNMENT/i;

      const candidates = [];
      for (let line of lines) {
        if (bad.test(line)) continue;
        if (!/[A-Za-zÑñ]{3,}/.test(line)) continue;
        let clean = line.replace(/[^A-Za-zÑñ\s\.\-']/g, " ").replace(/\s+/g, " ").trim();
        const words = clean.split(" ");
        if (words.length >= 2 && clean.length >= 8 && clean.length <= 48) {
          // Prefer lines that look like proper names
          const score = words.length * 10 + clean.length;
          candidates.push({ text: clean, score });
        }
      }
      if (candidates.length === 0) return "";
      candidates.sort((a,b) => b.score - a.score);
      return candidates[0].text;
    }

    function retake() {
      setStep(2);
      startCam();
      show("Place the ID card inside the green frame again.", "info");
    }

    function saveFinal() {
      const name = document.getElementById("edit-name").value.trim();
      if (!collected.oscaId) {
        show("Missing QR ID. Start over.", "error");
        return;
      }
      collected.fullName = name || "Not provided";

      show("Saving to Google Sheets...", "info");
      const now = new Date();
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          oscaId: collected.oscaId,
          fullName: collected.fullName,
          scanTime: now.toLocaleTimeString(),
          date: now.toLocaleDateString(),
          device: navigator.userAgent.substring(0,50),
          notes: "Smart OCR"
        })
      }).then(() => {
        show("Saved!\n\nID: " + collected.oscaId + "\nName: " + collected.fullName, "success");
        setTimeout(restart, 4000);
      }).catch(() => show("Save failed. Check internet or Script URL.", "error"));
    }

    function show(msg, type) {
      const b = document.getElementById("result");
      b.className = "result-box show " + type;
      b.innerText = msg;
    }

    window.addEventListener("load", restart);
  </script>
</body>
</html>
