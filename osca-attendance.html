<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OSCA Attendance - Reliable ID Reading</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 14px;
    }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.25rem; margin-bottom: 3px; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 14px; font-size: 0.85rem; }

    .step-indicator { display: flex; gap: 6px; margin-bottom: 14px; }
    .step {
      flex: 1; text-align: center; padding: 8px 4px;
      border-radius: 8px; background: #1e293b; font-size: 0.75rem; color: #94a3b8;
    }
    .step.active { background: #3b82f6; color: white; }
    .step.done { background: #166534; color: #bbf7d0; }

    #reader, #ocr-area {
      width: 100%; border-radius: 12px; overflow: hidden;
      background: #1e293b; min-height: 240px; position: relative;
    }
    #ocr-area { display: none; text-align: center; }
    #ocr-area video { width: 100%; display: block; }
    
    /* Guide overlay */
    .guide-frame {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 88%; height: 58%;
      border: 3px solid #22c55e;
      border-radius: 10px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
    }
    .guide-text {
      position: absolute; bottom: 12px; left: 0; right: 0;
      text-align: center; color: #fff; font-size: 0.85rem;
      text-shadow: 0 1px 3px black; pointer-events: none;
    }

    #captured-img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: none; }

    .result-box {
      margin-top: 12px; padding: 13px; background: #1e293b;
      border-radius: 11px; display: none; white-space: pre-wrap;
      font-size: 0.9rem; line-height: 1.4;
    }
    .result-box.show { display: block; }
    .success { border-left: 4px solid #22c55e; }
    .error { border-left: 4px solid #ef4444; }
    .info { border-left: 4px solid #3b82f6; }
    .warning { border-left: 4px solid #eab308; }

    .btn {
      display: block; width: 100%; padding: 13px; margin-top: 9px;
      border: none; border-radius: 10px; font-size: 0.95rem;
      font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn-warning { background: #d97706; color: white; }
    .btn-secondary { background: #334155; color: white; }

    .edit-box {
      background: #1e293b; border-radius: 11px; padding: 13px;
      margin-top: 11px; display: none;
    }
    .edit-box label { font-size: 0.8rem; color: #94a3b8; display: block; margin-bottom: 3px; }
    .edit-box input, .edit-box textarea {
      width: 100%; padding: 10px; border-radius: 8px;
      border: 1px solid #475569; background: #0f172a; color: white;
      font-size: 0.95rem; margin-bottom: 9px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OSCA Attendance</h1>
    <p class="subtitle">Reliable Sequential Reading</p>

    <div class="step-indicator">
      <div class="step active" id="step1">1. QR</div>
      <div class="step" id="step2">2. ID Card</div>
      <div class="step" id="step3">3. Confirm</div>
    </div>

    <div id="reader"></div>

    <div id="ocr-area">
      <div class="guide-frame"></div>
      <div class="guide-text">Align the ID card inside the green frame</div>
    </div>

    <div id="result" class="result-box"></div>

    <div class="edit-box" id="edit-box">
      <label>OSCA ID (from QR)</label>
      <input type="text" id="edit-id" readonly>

      <label>Full Name (edit if needed)</label>
      <input type="text" id="edit-name" placeholder="Detected name">

      <label>Detected Text (for checking)</label>
      <textarea id="edit-raw" rows="3" style="font-size:0.8rem; color:#94a3b8;"></textarea>
    </div>

    <button class="btn btn-primary" id="btn-capture" style="display:none;" onclick="captureAndOCR()">
      Capture ID Card
    </button>
    <button class="btn btn-warning" id="btn-retake" style="display:none;" onclick="retakePhoto()">
      Retake Photo
    </button>
    <button class="btn btn-success" id="btn-save" style="display:none;" onclick="saveFinal()">
      Save Attendance
    </button>
    <button class="btn btn-secondary" onclick="restartProcess()">Start Over</button>
  </div>

  <script>
    // ========== PASTE YOUR REAL SCRIPT URL HERE ==========
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzlrjeYzjjFQh3b8CFBtYc8mkPEChHley_xO2914EAGdwO0lr5Osa3zjdlfEZsWOhOj/exec";
    // ====================================================

    let html5QrCode = null;
    let videoStream = null;
    let currentStep = 1;
    let collected = { oscaId: "", fullName: "", rawOCR: "" };

    function setStep(step) {
      currentStep = step;
      document.getElementById("step1").className = "step" + (step === 1 ? " active" : step > 1 ? " done" : "");
      document.getElementById("step2").className = "step" + (step === 2 ? " active" : step > 2 ? " done" : "");
      document.getElementById("step3").className = "step" + (step === 3 ? " active" : "");

      document.getElementById("reader").style.display = step === 1 ? "block" : "none";
      document.getElementById("ocr-area").style.display = step === 2 ? "block" : "none";
      document.getElementById("btn-capture").style.display = step === 2 ? "block" : "none";
      document.getElementById("btn-retake").style.display = step === 3 ? "block" : "none";
      document.getElementById("btn-save").style.display = step === 3 ? "block" : "none";
      document.getElementById("edit-box").style.display = step === 3 ? "block" : "none";
    }

    function restartProcess() {
      collected = { oscaId: "", fullName: "", rawOCR: "" };
      document.getElementById("result").classList.remove("show");
      document.getElementById("edit-id").value = "";
      document.getElementById("edit-name").value = "";
      document.getElementById("edit-raw").value = "";
      stopQRScanner();
      stopOCRCamera();
      setStep(1);
      startQRScanner();
      showResult("Step 1: Scan the QR code first", "info");
    }

    // ===== QR =====
    function onScanSuccess(decodedText) {
      if (currentStep !== 1) return;
      stopQRScanner();

      let oscaId = "";
      const text = decodedText.trim();
      if (text.includes("Senior_citizen_id=")) {
        oscaId = text.split("Senior_citizen_id=")[1].trim();
      } else if (/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i.test(text)) {
        oscaId = text.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i)[0];
      } else {
        oscaId = text;
      }

      collected.oscaId = oscaId;
      showResult("QR OK!\nID: " + oscaId + "\n\nNow capture the physical ID card inside the green frame.", "success");
      setStep(2);
      startOCRCamera();
    }

    function startQRScanner() {
      if (html5QrCode) return;
      html5QrCode = new Html5Qrcode("reader");
      Html5Qrcode.getCameras().then(cameras => {
        if (cameras.length) {
          html5QrCode.start(cameras[cameras.length-1].id, {fps:10, qrbox:{width:250,height:250}}, onScanSuccess, ()=>{});
        }
      });
    }

    function stopQRScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => { html5QrCode.clear(); html5QrCode = null; }).catch(()=>{ html5QrCode = null; });
      }
    }

    // ===== OCR with auto-rotation =====
    async function startOCRCamera() {
      const area = document.getElementById("ocr-area");
      try {
        if (videoStream) videoStream.getTracks().forEach(t => t.stop());

        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: {ideal: 1280}, height: {ideal: 720} }
        });

        // Clear previous video but keep guides
        const oldVideo = area.querySelector("video");
        if (oldVideo) oldVideo.remove();

        const video = document.createElement("video");
        video.srcObject = videoStream;
        video.setAttribute("playsinline", true);
        video.autoplay = true;
        video.style.width = "100%";
        video.play();
        area.insertBefore(video, area.firstChild);

      } catch (err) {
        showResult("Camera error: " + err.message, "error");
      }
    }

    function stopOCRCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
        videoStream = null;
      }
    }

    // Helper: rotate canvas
    function rotateCanvas(srcCanvas, degrees) {
      const rad = degrees * Math.PI / 180;
      const w = srcCanvas.width;
      const h = srcCanvas.height;
      const canvas = document.createElement("canvas");
      
      if (degrees % 180 === 0) {
        canvas.width = w; canvas.height = h;
      } else {
        canvas.width = h; canvas.height = w;
      }
      
      const ctx = canvas.getContext("2d");
      ctx.translate(canvas.width/2, canvas.height/2);
      ctx.rotate(rad);
      ctx.drawImage(srcCanvas, -w/2, -h/2);
      return canvas;
    }

    async function captureAndOCR() {
      const video = document.querySelector("#ocr-area video");
      if (!video || video.videoWidth === 0) {
        showResult("Camera not ready. Wait a moment.", "warning");
        return;
      }

      showResult("Capturing image...", "info");

      // Capture original
      const orig = document.createElement("canvas");
      orig.width = video.videoWidth;
      orig.height = video.videoHeight;
      orig.getContext("2d").drawImage(video, 0, 0);

      // Enhance contrast
      const ctx = orig.getContext("2d");
      const imgData = ctx.getImageData(0, 0, orig.width, orig.height);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const avg = (d[i] + d[i+1] + d[i+2]) / 3;
        const v = avg > 130 ? Math.min(255, avg * 1.2) : Math.max(0, avg * 0.8);
        d[i] = d[i+1] = d[i+2] = v;
      }
      ctx.putImageData(imgData, 0, 0);

      showResult("Testing different orientations...\nThis may take 15–30 seconds", "info");

      const angles = [0, 90, 180, 270];
      let bestText = "";
      let bestScore = 0;
      let bestName = "";

      for (let angle of angles) {
        const rotated = rotateCanvas(orig, angle);
        const dataUrl = rotated.toDataURL("image/jpeg", 0.9);

        try {
          const result = await Tesseract.recognize(dataUrl, "eng", {
            logger: m => {
              if (m.status === "recognizing text") {
                document.getElementById("result").innerText = 
                  `Trying ${angle}° ... ${Math.round(m.progress * 100)}%`;
              }
            }
          });

          const text = result.data.text.replace(/\s+/g, " ").trim();
          const score = text.length + (result.data.confidence || 0);

          if (score > bestScore && text.length > 20) {
            bestScore = score;
            bestText = result.data.text;
            bestName = extractName(result.data.text);
          }
        } catch (e) {
          console.log("Angle failed", angle, e);
        }
      }

      collected.rawOCR = bestText;

      if (!bestText || bestText.length < 25) {
        showResult("Could not read the card clearly.\n\nPlease retake with better lighting and align the card properly inside the green frame.", "error");
        return;
      }

      collected.fullName = bestName;

      document.getElementById("edit-id").value = collected.oscaId;
      document.getElementById("edit-name").value = bestName || "";
      document.getElementById("edit-raw").value = bestText;

      if (!bestName || bestName.length < 5) {
        showResult("Text was read but Name is unclear.\nPlease type the correct name below.", "warning");
      } else {
        showResult("Best reading found!\nPlease verify the name below.", "success");
      }

      setStep(3);
      stopOCRCamera();
    }

    function extractName(text) {
      const lines = text.split("\n").map(l => l.trim()).filter(l => l.length > 4);
      const skip = /OSCA|SENIOR|CITIZEN|ID|NO\.|NUMBER|BIRTH|DATE|ADDRESS|PHILIPPINES|REPUBLIC|OFFICE|GENDER|SEX|AGE|VALID|SIGNATURE|CONTROL|CITY|MUNICIPALITY|PROVINCE|BARANGAY|REGION/i;

      let candidates = [];
      for (let line of lines) {
        if (skip.test(line)) continue;
        if (!/[A-Za-zÑñ]{3,}/.test(line)) continue;
        let cleaned = line.replace(/[^A-Za-zÑñ\s\.\-']/g, " ").replace(/\s+/g, " ").trim();
        if (cleaned.split(" ").length >= 2 && cleaned.length >= 8 && cleaned.length <= 45) {
          candidates.push(cleaned);
        }
      }
      if (candidates.length === 0) return "";
      candidates.sort((a,b) => b.length - a.length);
      return candidates[0];
    }

    function retakePhoto() {
      setStep(2);
      startOCRCamera();
      showResult("Align the card inside the green frame and capture again.", "info");
    }

    function saveFinal() {
      const name = document.getElementById("edit-name").value.trim();
      if (!collected.oscaId) {
        showResult("Missing QR ID. Please start over.", "error");
        return;
      }
      collected.fullName = name || "Not provided";

      showResult("Saving...", "info");

      const now = new Date();
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          oscaId: collected.oscaId,
          fullName: collected.fullName,
          scanTime: now.toLocaleTimeString(),
          date: now.toLocaleDateString(),
          device: navigator.userAgent.substring(0,50),
          notes: "QR+OCR"
        })
      }).then(() => {
        showResult("Saved successfully!\n\nID: " + collected.oscaId + "\nName: " + collected.fullName, "success");
        setTimeout(restartProcess, 4000);
      }).catch(() => showResult("Save failed. Check internet / Script URL.", "error"));
    }

    function showResult(msg, type) {
      const box = document.getElementById("result");
      box.className = "result-box show " + type;
      box.innerText = msg;
    }

    window.addEventListener("load", restartProcess);
  </script>
</body>
</html>
